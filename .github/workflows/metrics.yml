name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: wjakubowski1
          template: classic
          base: header, repositories
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          theme: tokyonight
